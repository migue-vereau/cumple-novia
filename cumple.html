<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¡Feliz Cumpleaños, Mi Amor! 🌻✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            background: #050108;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* FONDO LLENO DE LUCES Y FUEGOS ARTIFICIALES MASIVOS */
        .sky-universe {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 1;
        }
        .firework-particle {
            position: absolute; width: 8px; height: 8px; border-radius: 50%;
            box-shadow: 0 0 25px #ffeb3b, 0 0 50px #ff007f, 0 0 75px #00e676, 0 0 100px #00b0ff;
            animation: explodeReal 1.4s infinite ease-out;
        }
        @keyframes explodeReal {
            0% { transform: scale(0.1); opacity: 1; filter: brightness(2); }
            50% { transform: scale(45); opacity: 0.9; }
            100% { transform: scale(70); opacity: 0; }
        }

        /* GLOBOS CRUZÁNDOSE: Flotando hacia arriba Y cayendo al mismo tiempo */
        .balloons-chaos {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 2;
        }
        .balloon-up {
            position: absolute; width: 55px; height: 70px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: moveUp 5s infinite linear;
            box-shadow: inset -10px -10px 25px rgba(0,0,0,0.5), 0 0 25px rgba(255,255,255,0.4);
            opacity: 0.95;
        }
        .balloon-down {
            position: absolute; width: 55px; height: 70px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: moveDown 6s infinite linear;
            box-shadow: inset -10px -10px 25px rgba(0,0,0,0.5), 0 0 25px rgba(255,255,255,0.4);
            opacity: 0.95;
        }
        .balloon-up::after, .balloon-down::after {
            content: ""; position: absolute; bottom: -14px; left: 26px; width: 2px; height: 28px; background: rgba(255,255,255,0.7);
        }
        @keyframes moveUp {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(-20vh) translateX(40px) rotate(15deg); }
        }
        @keyframes moveDown {
            0% { transform: translateY(-20vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(110vh) translateX(-40px) rotate(-15deg); }
        }

        /* CONTENEDOR CENTRAL DE IMPACTO */
        .center-stage {
            position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 95%; max-width: 950px; text-align: center; gap: 18px;
            background: rgba(10, 2, 15, 0.4);
            padding: 20px;
            border-radius: 30px;
            backdrop-filter: blur(3px);
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.2);
        }

        /* TÍTULO LUMINOSO Y GIGANTE */
        h1 {
            font-size: 2.2rem; font-weight: 900; text-transform: uppercase; margin: 0;
            background: linear-gradient(45deg, #ff007f, #ffeb3b, #00e676, #00b0ff, #ff758c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255, 235, 59, 1)) drop-shadow(0 0 10px rgba(255, 0, 127, 1));
            letter-spacing: 1px;
            animation: textNeon 1.5s infinite alternate;
        }
        @keyframes textNeon {
            from { filter: drop-shadow(0 0 15px rgba(255, 235, 59, 0.8)); }
            to { filter: drop-shadow(0 0 35px rgba(255, 255, 255, 1)) drop-shadow(0 0 20px rgba(0, 230, 118, 1)); }
        }

        /* PASTEL GIGANTE HIPER-DETALLADO CON CHISPAS DE CHOCOLATE */
        .cake-massive {
            position: relative; width: 420px; height: 260px; margin: 10px auto;
            animation: cakeBreathing 2.5s ease-in-out infinite;
        }
        @keyframes cakeBreathing {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-8px); }
        }

        .c-layer {
            position: absolute; left: 50%; transform: translateX(-50%); border-radius: 16px;
        }
        /* Base con textura pesada de chispas de chocolate reales */
        .layer-bot {
            bottom: 0; width: 420px; height: 90px;
            background: linear-gradient(90deg, #d7ccc8, #fff3e0, #d7ccc8);
            border: 4px solid #bcaaa4; box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.2);
            background-image: 
                radial-gradient(#3e2723 18%, transparent 19%), 
                radial-gradient(#3e2723 18%, transparent 19%),
                radial-gradient(#4e342e 20%, transparent 21%);
            background-size: 20px 20px, 30px 30px, 15px 15px;
            background-position: 0 0, 10px 10px, 5px 15px;
        }
        .layer-mid {
            bottom: 85px; width: 330px; height: 80px;
            background: linear-gradient(90deg, #ffe0b2, #ffffff, #ffe0b2);
            border: 4px solid #ffcc80;
            background-image: 
                radial-gradient(#3e2723 18%, transparent 19%), 
                radial-gradient(#4e342e 20%, transparent 21%);
            background-size: 22px 22px, 14px 14px;
            background-position: 5px 5px, 12px 2px;
        }
        .layer-top-cake {
            bottom: 160px; width: 240px; height: 70px;
            background: linear-gradient(90deg, #ffccbc, #fff, #ffccbc);
            border: 4px solid #ffab91;
            background-image: radial-gradient(#3e2723 18%, transparent 19%);
            background-size: 18px 18px;
        }
        /* Glaseado brillante de crema que chorrea */
        .frosting-drip-3d {
            position: absolute; top: 0; width: 100%; height: 26px; background: #ffffff; border-radius: 14px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3), inset 0 -4px 8px rgba(0,0,0,0.1);
        }

        /* VELAS EXPLOSIVAS LANZANDO CHISPAS DE FUEGO CONTINUAS */
        .candles-cluster {
            position: absolute; top: -55px; left: 50%; transform: translateX(-50%); display: flex; gap: 40px; z-index: 5;
        }
        .candle-stick-real {
            width: 15px; height: 60px; background: linear-gradient(to top, #ff4081, #ff80ab, #ffffff);
            border-radius: 6px; position: relative; box-shadow: 0 0 15px rgba(255,64,129,0.9);
        }
        .flame-explosive {
            position: absolute; top: -32px; left: 50%; transform: translateX(-50%); width: 20px; height: 35px;
            background: radial-gradient(circle, #ffffff 15%, #ffeb3b 45%, #ff5722 80%, #ff0000 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 30px #ffeb3b, 0 0 50px #ff5722, 0 0 80px #ff007f, 0 0 100px #ffffff;
            animation: flameVibe 0.25s infinite alternate;
        }
        @keyframes flameVibe {
            0% { transform: translateX(-50%) scale(0.95) rotate(-6deg); filter: brightness(1); }
            100% { transform: translateX(-50%) scale(1.25) rotate(6deg); filter: brightness(1.4); }
        }
        /* Chispas de fuego saliendo disparadas en ráfaga */
        .fire-spark {
            position: absolute; width: 7px; height: 7px; background: #ffffff; border-radius: 50%;
            box-shadow: 0 0 12px #ffeb3b, 0 0 20px #ff007f, 0 0 30px #ff5722;
            animation: sparkShoot 0.7s infinite linear;
        }
        @keyframes sparkShoot {
            0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
            100% { transform: translate(calc(var(--vx) * 65px), calc(var(--vy) * 65px)) scale(0); opacity: 0; }
        }

        /* TEXTO ROMÁNTICO DEFINITIVO (Grande, claro, con brillo intenso) */
        .love-text-epic {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin: 5px 0;
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ff007f, 2px 2px 10px rgba(0,0,0,1);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Botón dinámico */
        .btn-return {
            background: linear-gradient(135deg, #ff007f, #ffeb3b);
            color: #1b0c1e; padding: 12px 30px; border-radius: 35px; font-weight: 900;
            text-decoration: none; font-size: 1rem; box-shadow: 0 0 25px rgba(255, 235, 59, 0.8);
            transition: transform 0.3s ease; display: inline-block; margin-top: 5px;
        }
        .btn-return:hover { transform: scale(1.12); }
    </style>
</head>
<body>

    <!-- Fondo saturado de luces y fuegos artificiales -->
    <div class="sky-universe" id="universeBox"></div>

    <!-- Globos caóticos subiendo y bajando al mismo tiempo -->
    <div class="balloons-chaos" id="chaosBalloons"></div>

    <div class="center-stage">
        <h1>¡FELIZ CUMPLEAÑOS A LA NIÑA MÁS HERMOSA DEL MUNDOOOOOO!</h1>

        <!-- Pastel gigante con chispas de chocolate y velas lanzando fuego -->
        <div class="cake-massive">
            <div class="candles-cluster">
                <div class="candle-stick-real">
                    <div class="flame-explosive"></div>
                    <div class="fire-spark" style="--vx: -1.8; --vy: -2.5;"></div>
                    <div class="fire-spark" style="--vx: 1.5; --vy: -2.8;"></div>
                </div>
                <div class="candle-stick-real">
                    <div class="flame-explosive"></div>
                    <div class="fire-spark" style="--vx: -1.1; --vy: -3.1;"></div>
                    <div class="fire-spark" style="--vx: 1.3; --vy: -2.4;"></div>
                </div>
                <div class="candle-stick-real">
                    <div class="flame-explosive"></div>
                    <div class="fire-spark" style="--vx: -1.5; --vy: -2.7;"></div>
                    <div class="fire-spark" style="--vx: 1.8; --vy: -2.9;"></div>
                </div>
            </div>

            <div class="c-layer layer-top-cake"><div class="frosting-drip-3d"></div></div>
            <div class="c-layer layer-mid"><div class="frosting-drip-3d"></div></div>
            <div class="c-layer layer-bot"><div class="frosting-drip-3d"></div></div>
        </div>

        <!-- Texto romántico limpio, gigante y resplandeciente -->
        <div class="love-text-epic">TE AMO MAS DE LO Q PUEDAS LLEGAR A IMAGINAR Y SENTIR</div>

        <a href="index.html" class="btn-return">⬅ Volver al multiverso</a>
    </div>

    <script>
        // Fuegos artificiales masivos estallando por todo el fondo constantemente
        const universeBox = document.getElementById('universeBox');
        setInterval(() => {
            const fw = document.createElement('div');
            fw.classList.add('firework-particle');
            fw.style.left = (Math.random() * 90 + 5) + 'vw';
            fw.style.top = (Math.random() * 80 + 10) + 'vh';
            universeBox.appendChild(fw);
            setTimeout(() => fw.remove(), 1400);
        }, 400); // Mucha más frecuencia para que parezca una fiesta real

        // Generador de globos cruzándose (la mitad sube, la mitad baja al mismo tiempo)
        const chaosBalloons = document.getElementById('chaosBalloons');
        const colorList = ['#ff4081', '#ffeb3b', '#00e676', '#00b0ff', '#e040fb', '#ff5722', '#7c4dff'];
        
        for (let i = 0; i < 22; i++) {
            const balloon = document.createElement('div');
            // Alternar entre subir y bajar
            const isUp = i % 2 === 0;
            balloon.classList.add(isUp ? 'balloon-up' : 'balloon-down');
            
            balloon.style.left = (Math.random() * 92) + 'vw';
            balloon.style.backgroundColor = colorList[Math.floor(Math.random() * colorList.length)];
            balloon.style.animationDuration = (3.5 + Math.random() * 3.5) + 's';
            balloon.style.animationDelay = (Math.random() * 5) + 's';
            chaosBalloons.appendChild(balloon);
        }
    </script>
</body>
</html>
