<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para mi princesa 🌻✨</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a020d; font-family: 'Playfair Display', serif; }
        
        /* Fuegos artificiales de fondo */
        .sky { position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* Pastel Realista y Grande */
        .cake-wrapper {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            z-index: 5; text-align: center;
        }
        .cake-3d {
            width: 400px; height: 300px; margin: 0 auto;
            background: radial-gradient(circle at 50% 50%, #fffaf0 20%, #f5e6d3 100%);
            border-radius: 20px 20px 10px 10px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-bottom: 20px solid #d4a373;
        }

        /* Título Vibrante */
        .title-bday {
            font-size: 3rem; color: #ffeb3b; text-transform: uppercase;
            text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f;
            margin-bottom: 30px; animation: pulse 2s infinite;
        }

        /* Texto Romántico */
        .love-text {
            font-size: 2.2rem; color: #fff; max-width: 800px; margin: 20px auto;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8); font-style: italic;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        /* Botón volver */
        .back-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #ff007f; color: white; padding: 15px 30px; border-radius: 50px;
            text-decoration: none; font-weight: bold; z-index: 10;
        }
    </style>
</head>
<body>

    <div class="sky" id="fireworks"></div>

    <div class="cake-wrapper">
        <h1 class="title-bday">¡FELIZ CUMPLEAÑOS A LA NIÑA MÁS HERMOSA DEL MUNDOOOOOO!</h1>
        
        <div class="cake-3d">
            <div style="font-size: 5rem;">🎂</div>
        </div>

        <p class="love-text">TE AMO MAS DE LO Q PUEDAS LLEGAR A IMAGINAR Y SENTIR</p>
    </div>

    <a href="index.html" class="back-btn">Regresar al multiverso</a>

    <script>
        // Efecto de fuegos artificiales simples y globos
        function createFirework() {
            const f = document.createElement('div');
            f.style.position = 'absolute'; f.style.left = Math.random() * 100 + 'vw';
            f.style.top = Math.random() * 50 + 'vh'; f.style.fontSize = '30px';
            f.innerText = '✨'; document.getElementById('fireworks').appendChild(f);
            setTimeout(() => f.remove(), 1000);
        }
        setInterval(createFirework, 500);
    </script>
</body>
</html>
