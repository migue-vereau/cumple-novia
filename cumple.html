<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¡Feliz Cumpleaños, Mi Amor! 🌻✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CONFIGURACIÓN GLOBAL Y FONDO DORADO TEXTURIZADO PESADO
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #fff176 0%, #ffb300 35%, #e65100 75%, #4e1400 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* ==========================================================================
           2. GUIRNALDAS DE BANDERINES MÚLTIPLES (SUPERIOR DOBLE FILA)
           ========================================================================== */
        .garland-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 110px;
            pointer-events: none;
            z-index: 3;
            display: flex;
            justify-content: space-around;
        }

        .garland-container-2 {
            position: absolute;
            top: 35px;
            left: 0;
            width: 100%;
            height: 110px;
            pointer-events: none;
            z-index: 3;
            display: flex;
            justify-content: space-around;
            opacity: 0.85;
        }

        .pennant {
            width: 0;
            height: 0;
            border-left: 24px solid transparent;
            border-right: 24px solid transparent;
            border-top: 40px solid;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
            animation: pennantSwing 2s ease-in-out infinite alternate;
            transform-origin: top center;
        }

        .p-green { border-top-color: #00e676; animation-delay: 0.1s; }
        .p-sky { border-top-color: #00b0ff; animation-delay: 0.3s; }
        .p-yellow { border-top-color: #ffea00; animation-delay: 0.2s; }
        .p-red { border-top-color: #ff1744; animation-delay: 0.4s; }
        .p-orange { border-top-color: #ff9100; animation-delay: 0.15s; }
        .p-blue { border-top-color: #7c4dff; animation-delay: 0.35s; }
        .p-pink { border-top-color: #ff4081; animation-delay: 0.25s; }
        .p-cyan { border-top-color: #00e5ff; animation-delay: 0.05s; }

        @keyframes pennantSwing {
            0% { transform: rotate(-7deg); }
            100% { transform: rotate(7deg); }
        }

        /* ==========================================================================
           3. FUEGOS ARTIFICIALES COLOSALES Y BRILLANTES (MULTICOLOR TOTAL)
           ========================================================================== */
        .sky-storm {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .firework-particle {
            position: absolute;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            animation: explodeMassiveHeavy 1.5s infinite ease-out;
        }

        @keyframes explodeMassiveHeavy {
            0% {
                transform: translate(0, 0) scale(2.5);
                opacity: 1;
                box-shadow: 0 0 25px #fff, 0 0 50px #ffea00, 0 0 80px #00e5ff, 0 0 110px #ff1744;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.2);
                opacity: 0;
                box-shadow: 0 0 2px transparent;
            }
        }

        /* ==========================================================================
           4. LLUVIA MASIVA DE CONFETI, ESTRELLAS Y SERPENTINAS PESADAS
           ========================================================================== */
        .confetti-rain {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 4;
        }

        .confetti-piece {
            position: absolute;
            width: 16px;
            height: 22px;
            opacity: 0.95;
            animation: fallConfettiHeavy 3s infinite linear;
        }

        @keyframes fallConfettiHeavy {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 1; }
            100% { transform: translateY(110vh) rotate(1080deg) translateX(100px); opacity: 0.3; }
        }

        /* ==========================================================================
           5. LLUVIA DE GLOBOS GIGANTES (AZUL, VERDE, AMARILLO, ROJO, NARANJA, CELESTE)
           ========================================================================== */
        .balloons-storm {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 2;
        }

        .b-item {
            position: absolute;
            width: 85px;
            height: 110px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: stormFloatHeavy 4.2s infinite linear;
            box-shadow: inset -14px -20px 35px rgba(0,0,0,0.55), 0 0 35px rgba(255,255,255,0.9);
            opacity: 0.96;
        }

        .b-item::after {
            content: "";
            position: absolute;
            bottom: -22px;
            left: 40px;
            width: 2px;
            height: 38px;
            background: rgba(255,255,255,0.95);
        }

        @keyframes stormFloatHeavy {
            0% { transform: translateY(115vh) translateX(0) scale(0.9); }
            50% { transform: translateY(50vh) translateX(40px) scale(1.1); }
            100% { transform: translateY(-20vh) translateX(-40px) scale(1.25); }
        }

        /* ==========================================================================
           6. CONTENEDOR ESCENARIO PRINCIPAL
           ========================================================================== */
        .colossal-stage {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 100vh;
            padding-bottom: 12px;
            text-align: center;
            pointer-events: none;
        }

        /* ==========================================================================
           7. TÍTULO PRINCIPAL (INTACTO Y PERFECTO)
           ========================================================================== */
        h1 {
            position: relative;
            z-index: 100;
            font-size: 2.3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff 15%, #ffe57f 40%, #ff5252 80%, #ff1744 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 20px rgba(255, 23, 68, 1));
            letter-spacing: 1.5px;
            animation: textFloatEffect 2.5s ease-in-out infinite alternate;
            pointer-events: auto;
        }

        @keyframes textFloatEffect {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.02); }
        }

        /* ==========================================================================
           8. PASTEL GIGANTE PESADO, DETALLADO Y LLENO DE DECORACIONES
           ========================================================================== */
        .mega-cake {
            position: relative;
            z-index: 10;
            width: 860px;
            height: 460px;
            margin: 0 auto;
            animation: cakeBreathingMega 3s ease-in-out infinite;
            filter: drop-shadow(0 45px 45px rgba(30,5,0,0.9));
            pointer-events: auto;
        }

        @keyframes cakeBreathingMega {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .m-tier {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 30px;
        }

        /* Capa Base del Pastel (Gran Tamaño) */
        .tier-base {
            bottom: 0;
            width: 860px;
            height: 155px;
            background: linear-gradient(90deg, #d7ccc8, #fff8e1, #d7ccc8);
            border: 5px solid #6d4c41;
            border-bottom: 14px solid #3e2723;
            box-shadow: inset 0 22px 35px rgba(255,255,255,0.95), inset 0 -22px 35px rgba(62,39,35,0.6);
        }

        /* Capa Intermedia del Pastel */
        .tier-middle {
            bottom: 143px;
            width: 680px;
            height: 145px;
            background: linear-gradient(90deg, #ffcdd2, #fff9c4, #ffcdd2);
            border: 5px solid #e57373;
            border-bottom: 12px solid #b71c1c;
            box-shadow: inset 0 20px 30px rgba(255,255,255,0.95), inset 0 -20px 30px rgba(183,28,28,0.5);
        }

        /* Capa Superior del Pastel */
        .tier-top {
            bottom: 278px;
            width: 500px;
            height: 135px;
            background: linear-gradient(90deg, #b9f6ca, #e0f7fa, #b9f6ca);
            border: 5px solid #00e676;
            border-bottom: 10px solid #00c853;
            box-shadow: inset 0 18px 28px rgba(255,255,255,1), inset 0 -18px 28px rgba(0,200,83,0.5);
        }

        /* Rellenos multicolores visibles entre capas (Bizcocho gourmet) */
        .cake-filling-multi {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(45deg, #ff1744, #ff1744 10px, #ffea00 10px, #ffea00 20px, #00b0ff 20px, #00b0ff 30px);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
        }

        /* Cobertura Glaseado de Fresa / Chocolate goteando con alto brillo */
        .frosting-mega {
            position: absolute;
            top: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(180deg, #ff4081 0%, #880e4f 100%);
            border-radius: 22px;
            box-shadow: 0 12px 22px rgba(0,0,0,0.4);
        }

        /* Decoraciones extra incrustadas en el pastel (Bolitas de colores comestibles) */
        .cake-sprinkle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
            z-index: 5;
        }

        /* ==========================================================================
           9. VELAS Y LLAMAS GIGANTES MÚLTIPLES
           ========================================================================== */
        .candles-mega-row {
            position: absolute;
            top: -90px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 75px;
            z-index: 15;
        }

        .candle-stick-mega {
            width: 22px;
            height: 95px;
            background: linear-gradient(90deg, #00e676, #00b0ff, #ffea00, #ff1744);
            border-radius: 6px;
            position: relative;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.5), 0 0 30px rgba(0,230,118,0.9);
        }

        .mega-flame {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 58px;
            background: radial-gradient(circle at 50% 25%, #ffffff 15%, #ffea00 45%, #ff3d00 80%, rgba(255,0,0,0) 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 45px #ffea00, 0 0 85px #ff3d00, 0 0 120px #ff1744, 0 0 150px #00e5ff;
            animation: flameMegaFlicker 0.25s infinite alternate;
        }

        @keyframes flameMegaFlicker {
            0% { transform: translateX(-50%) scale(0.9) rotate(-6deg); filter: brightness(1); }
            100% { transform: translateX(-50%) scale(1.3) rotate(6deg); filter: brightness(1.5); }
        }

        /* ==========================================================================
           10. TEXTO ROMÁNTICO Y BOTÓN ESTELAR
           ========================================================================== */
        .love-text-floating {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fffae6;
            margin: 6px 0 10px 0;
            text-shadow: 0 0 25px rgba(255, 235, 59, 1), 0 0 45px rgba(255, 23, 68, 0.9), 3px 3px 10px rgba(0,0,0,0.9);
            letter-spacing: 1.5px;
            text-align: center;
            animation: textFloatingMovement 3s ease-in-out infinite alternate;
            pointer-events: auto;
        }

        @keyframes textFloatingMovement {
            0% { transform: translateY(0) rotate(-1deg); }
            100% { transform: translateY(-8px) rotate(1deg); }
        }

        .btn-colossal {
            background: linear-gradient(135deg, #00e676, #00b0ff, #ffea00, #ff1744);
            color: #ffffff;
            padding: 14px 42px;
            border-radius: 35px;
            font-weight: 900;
            text-decoration: none;
            font-size: 1.1rem;
            box-shadow: 0 0 40px rgba(0, 230, 118, 0.9);
            transition: transform 0.3s ease;
            display: inline-block;
            margin-bottom: 10px;
            pointer-events: auto;
        }

        .btn-colossal:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- Fila 1 de Guirnaldas de banderines multicolores -->
    <div class="garland-container">
        <div class="pennant p-green"></div>
        <div class="pennant p-sky"></div>
        <div class="pennant p-yellow"></div>
        <div class="pennant p-red"></div>
        <div class="pennant p-orange"></div>
        <div class="pennant p-blue"></div>
        <div class="pennant p-pink"></div>
        <div class="pennant p-cyan"></div>
        <div class="pennant p-green"></div>
        <div class="pennant p-sky"></div>
        <div class="pennant p-yellow"></div>
        <div class="pennant p-red"></div>
        <div class="pennant p-orange"></div>
    </div>

    <!-- Fila 2 de Guirnaldas de banderines cruzados -->
    <div class="garland-container-2">
        <div class="pennant p-pink"></div>
        <div class="pennant p-cyan"></div>
        <div class="pennant p-green"></div>
        <div class="pennant p-sky"></div>
        <div class="pennant p-yellow"></div>
        <div class="pennant p-red"></div>
        <div class="pennant p-orange"></div>
        <div class="pennant p-blue"></div>
        <div class="pennant p-pink"></div>
        <div class="pennant p-cyan"></div>
        <div class="pennant p-green"></div>
        <div class="pennant p-sky"></div>
    </div>

    <!-- Fuegos artificiales colosales de fondo -->
    <div class="sky-storm" id="skyStorm"></div>

    <!-- Lluvia masiva de confeti y serpentinas pesadas -->
    <div class="confetti-rain" id="confettiRain"></div>

    <!-- Lluvia masiva de globos de colores vivos -->
    <div class="balloons-storm" id="balloonsStorm"></div>

    <!-- Escenario principal -->
    <div class="colossal-stage">
        
        <!-- Título principal protegido e intacto -->
        <h1>¡FELIZ CUMPLEAÑOS A LA NIÑA MÁS HERMOSA DEL MUNDOOOOOO!</h1>

        <!-- Pastel Colosal Gigante con decoraciones de confeti, bizcochos y 5 velas -->
        <div class="mega-cake">
            <div class="candles-mega-row">
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
            </div>

            <!-- Capa Superior con decoraciones -->
            <div class="m-tier tier-top">
                <div class="cake-filling-multi"></div>
                <div class="frosting-mega"></div>
                <div class="cake-sprinkle" style="top: 10px; left: 80px; background: #ffea00;"></div>
                <div class="cake-sprinkle" style="top: 15px; left: 200px; background: #00e676;"></div>
                <div class="cake-sprinkle" style="top: 12px; left: 350px; background: #00b0ff;"></div>
                <div class="cake-sprinkle" style="top: 18px; left: 420px; background: #ff1744;"></div>
            </div>

            <!-- Capa Intermedia con decoraciones -->
            <div class="m-tier tier-middle">
                <div class="cake-filling-multi"></div>
                <div class="frosting-mega"></div>
                <div class="cake-sprinkle" style="top: 12px; left: 100px; background: #00e5ff;"></div>
                <div class="cake-sprinkle" style="top: 16px; left: 250px; background: #ffea00;"></div>
                <div class="cake-sprinkle" style="top: 10px; left: 400px; background: #00e676;"></div>
                <div class="cake-sprinkle" style="top: 15px; left: 550px; background: #ff9100;"></div>
            </div>

            <!-- Capa Base con decoraciones -->
            <div class="m-tier tier-base">
                <div class="cake-filling-multi"></div>
                <div class="frosting-mega"></div>
                <div class="cake-sprinkle" style="top: 14px; left: 150px; background: #ff1744;"></div>
                <div class="cake-sprinkle" style="top: 12px; left: 320px; background: #00b0ff;"></div>
                <div class="cake-sprinkle" style="top: 18px; left: 500px; background: #ffea00;"></div>
                <div class="cake-sprinkle" style="top: 10px; left: 700px; background: #7c4dff;"></div>
            </div>
        </div>

        <!-- Mensaje romántico -->
        <div class="love-text-floating">TE AMO MAS DE LO Q PUEDAS LLEGAR A IMAGINAR Y SENTIR</div>

        <!-- Botón de retorno -->
        <a href="index.html" class="btn-colossal">⬅ Volver al multiverso</a>
    </div>

    <!-- Motor JavaScript masivo con más densidad, colores y peso -->
    <script>
        /* Fuegos artificiales gigantes con todos los colores vibrantes */
        const skyStorm = document.getElementById('skyStorm');
        const fireworkColors = ['#00e676', '#00b0ff', '#ffea00', '#ff1744', '#ff9100', '#7c4dff', '#ff4081', '#00e5ff', '#ffffff'];

        function lanzarFuegoGigantePesado() {
            const centerX = Math.random() * 85 + 7;
            const centerY = Math.random() * 60 + 10;
            for (let i = 0; i < 48; i++) {
                const p = document.createElement('div');
                p.classList.add('firework-particle');
                const angle = (Math.PI * 2 / 48) * i;
                const distance = 100 + Math.random() * 140;
                p.style.left = centerX + 'vw';
                p.style.top = centerY + 'vh';
                p.style.backgroundColor = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
                p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                skyStorm.appendChild(p);
                setTimeout(() => p.remove(), 1500);
            }
        }
        setInterval(lanzarFuegoGigantePesado, 350);

        /* Confeti masivo cayendo sin parar */
        const confettiRain = document.getElementById('confettiRain');
        for (let i = 0; i < 110; i++) {
            const c = document.createElement('div');
            c.classList.add('confetti-piece');
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
            c.style.animationDuration = (2.0 + Math.random() * 2.8) + 's';
            c.style.animationDelay = (Math.random() * 4) + 's';
            if(Math.random() > 0.3) c.style.borderRadius = '50%';
            confettiRain.appendChild(c);
        }

        /* Globos gigantes saturados de azul, verde, amarillo, rojo, naranja, celeste y más */
        const balloonsStorm = document.getElementById('balloonsStorm');
        const vibrantBalloonColors = ['#00e676', '#00b0ff', '#ffea00', '#ff1744', '#ff9100', '#7c4dff', '#ff4081', '#00e5ff'];

        for (let i = 0; i < 95; i++) {
            const b = document.createElement('div');
            b.classList.add('b-item');
            b.style.left = (Math.random() * 95) + 'vw';
            b.style.backgroundColor = vibrantBalloonColors[Math.floor(Math.random() * vibrantBalloonColors.length)];
            b.style.animationDuration = (2.8 + Math.random() * 2.5) + 's';
            b.style.animationDelay = (Math.random() * 5) + 's';
            balloonsStorm.appendChild(b);
        }
    </script>
</body>
</html>
