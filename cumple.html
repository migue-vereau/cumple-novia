<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¡Feliz Cumpleaños, Mi Amor! 🌻✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            background: radial-gradient(circle at center, #15051a 0%, #06010a 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* CIELO PROFUNDO CON LUCES Y FUEGOS ARTIFICIALES DINÁMICOS */
        .sky-canvas {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 1;
        }
        .firework-fx {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            box-shadow: 0 0 20px #ffeb3b, 0 0 40px #ff007f, 0 0 60px #00e676, 0 0 80px #00b0ff;
            animation: fxExplode 1.2s infinite ease-out;
        }
        @keyframes fxExplode {
            0% { transform: scale(0.1); opacity: 1; }
            50% { transform: scale(30); opacity: 0.85; }
            100% { transform: scale(50); opacity: 0; }
        }

        /* GLOBOS REALISTAS CON EFECTO 3D (Subiendo y cayendo simultáneamente) */
        .balloons-layer {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 2;
        }
        .real-balloon-up {
            position: absolute; width: 50px; height: 65px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: bUp 5s infinite linear;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0.2) 70%);
            box-shadow: inset -8px -12px 20px rgba(0,0,0,0.5), 0 0 15px rgba(255,255,255,0.3);
            opacity: 0.95;
        }
        .real-balloon-down {
            position: absolute; width: 50px; height: 65px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: bDown 6s infinite linear;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0.2) 70%);
            box-shadow: inset -8px -12px 20px rgba(0,0,0,0.5), 0 0 15px rgba(255,255,255,0.3);
            opacity: 0.95;
        }
        .real-balloon-up::after, .real-balloon-down::after {
            content: ""; position: absolute; bottom: -12px; left: 23px; width: 1.5px; height: 25px; background: rgba(255,255,255,0.6);
        }
        @keyframes bUp {
            0% { transform: translateY(110vh) translateX(0) scale(1); }
            100% { transform: translateY(-15vh) translateX(35px) scale(1.05); }
        }
        @keyframes bDown {
            0% { transform: translateY(-15vh) translateX(0) scale(1.05); }
            100% { transform: translateY(110vh) translateX(-35px) scale(1); }
        }

        /* CONTENEDOR CENTRAL DE LA ESCENA */
        .stage-box {
            position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 95%; max-width: 950px; text-align: center; gap: 16px;
            background: rgba(12, 3, 18, 0.65);
            padding: 25px;
            border-radius: 35px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        /* TÍTULO ÉPICO Y ELEGANTE */
        h1 {
            font-size: 2rem; font-weight: 800; text-transform: uppercase; margin: 0;
            background: linear-gradient(135deg, #fff 20%, #ffd700 50%, #ff007f 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            letter-spacing: 1.5px;
        }

        /* PASTEL 3D HIPER-REALISTA CON CHISPAS DE CHOCOLATE Y TEXTURA DE CREMA */
        .hyper-cake {
            position: relative; width: 400px; height: 250px; margin: 5px auto;
            animation: cakeMove 3s ease-in-out infinite;
            filter: drop-shadow(0 25px 25px rgba(0,0,0,0.8));
        }
        @keyframes cakeMove {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .cake-tier {
            position: absolute; left: 50%; transform: translateX(-50%); border-radius: 15px;
        }
        /* Capa inferior con textura profunda y chispas de chocolate volumétricas */
        .tier-3 {
            bottom: 0; width: 400px; height: 85px;
            background: linear-gradient(180deg, #f5e6d3 0%, #d4b595 100%);
            border-bottom: 6px solid #8c6239;
            box-shadow: inset 0 10px 15px rgba(255,255,255,0.6), inset 0 -10px 15px rgba(0,0,0,0.3);
            background-image: 
                radial-gradient(#3d2314 22%, transparent 23%), 
                radial-gradient(#2b180d 22%, transparent 23%);
            background-size: 24px 24px, 16px 16px;
            background-position: 0 0, 12px 12px;
        }
        /* Capa media */
        .tier-2 {
            bottom: 80px; width: 320px; height: 75px;
            background: linear-gradient(180deg, #fff3e0, #e6ccb2);
            border-bottom: 5px solid #8c6239;
            box-shadow: inset 0 8px 12px rgba(255,255,255,0.7), inset 0 -8px 12px rgba(0,0,0,0.2);
            background-image: 
                radial-gradient(#3d2314 22%, transparent 23%);
            background-size: 20px 20px;
        }
        /* Capa superior */
        .tier-1 {
            bottom: 150px; width: 230px; height: 65px;
            background: linear-gradient(180deg, #ffffff, #f0ebd8);
            border-bottom: 4px solid #8c6239;
            box-shadow: inset 0 6px 10px rgba(255,255,255,0.9), inset 0 -6px 10px rgba(0,0,0,0.1);
            background-image: 
                radial-gradient(#3d2314 20%, transparent 21%);
            background-size: 16px 16px;
        }
        /* Crema de cobertura superior con brillo y relieve */
        .frosting-top {
            position: absolute; top: 0; width: 100%; height: 22px; 
            background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 100%);
            border-radius: 12px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.25);
        }

        /* VELAS REALISTAS CON CHISPAS EXPLOSIVAS DE FUEGO */
        .candles-row {
            position: absolute; top: -52px; left: 50%; transform: translateX(-50%); display: flex; gap: 38px; z-index: 5;
        }
        .candle-body {
            width: 13px; height: 55px; 
            background: linear-gradient(90deg, #ff4081, #ff80ab, #c2185b);
            border-radius: 4px; position: relative;
            box-shadow: inset -3px 0 5px rgba(0,0,0,0.4), 0 0 10px rgba(255,64,129,0.8);
        }
        .real-flame {
            position: absolute; top: -28px; left: 50%; transform: translateX(-50%); width: 16px; height: 30px;
            background: radial-gradient(circle at 50% 30%, #fff 15%, #ffeb3b 50%, #ff5722 80%, rgba(255,0,0,0) 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 25px #ffeb3b, 0 0 45px #ff5722, 0 0 65px #ff007f;
            animation: flameRealistic 0.3s infinite alternate;
        }
        @keyframes flameRealistic {
            0% { transform: translateX(-50%) scale(0.95) rotate(-4deg); }
            100% { transform: translateX(-50%) scale(1.15) rotate(4deg); }
        }
        /* Chispas de fuego que botan las velas constantemente */
        .spark-particle {
            position: absolute; width: 5px; height: 5px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px #ffeb3b, 0 0 15px #ff5722;
            animation: sparkFly 0.6s infinite linear;
        }
        @keyframes sparkFly {
            0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
            100% { transform: translate(calc(var(--sx) * 55px), calc(var(--sy) * 55px)) scale(0); opacity: 0; }
        }

        /* TEXTO ROMÁNTICO EN ALTA DEFINICIÓN */
        .love-text-hd {
            font-family: 'Cinzel', serif;
            font-size: 1.55rem;
            font-weight: 700;
            color: #fffacd;
            margin: 5px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.9), 0 0 40px rgba(255, 0, 127, 0.8), 2px 2px 8px rgba(0,0,0,0.9);
            letter-spacing: 0.8px;
        }

        /* BOTÓN DE RETORNO ESTELAR */
        .btn-stellar {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #15051a; padding: 12px 30px; border-radius: 30px; font-weight: 800;
            text-decoration: none; font-size: 0.95rem; box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
            transition: transform 0.3s ease; display: inline-block; margin-top: 5px;
        }
        .btn-stellar:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- Fuegos artificiales estallando en el fondo -->
    <div class="sky-canvas" id="skyCanvas"></div>

    <!-- Globos realistas 3D cruzándose -->
    <div class="balloons-layer" id="balloonsLayer"></div>

    <div class="stage-box">
        <h1>¡FELIZ CUMPLEAÑOS A LA NIÑA MÁS HERMOSA DEL MUNDOOOOOO!</h1>

        <!-- Pastel 3D hiper-realista con chispas de chocolate y velas con fuego -->
        <div class="hyper-cake">
            <div class="candles-row">
                <div class="candle-body">
                    <div class="real-flame"></div>
                    <div class="spark-particle" style="--sx: -1.6; --sy: -2.4;"></div>
                    <div class="spark-particle" style="--sx: 1.4; --sy: -2.6;"></div>
                </div>
                <div class="candle-body">
                    <div class="real-flame"></div>
                    <div class="spark-particle" style="--sx: -0.9; --sy: -2.9;"></div>
                    <div class="spark-particle" style="--sx: 1.2; --sy: -2.2;"></div>
                </div>
                <div class="candle-body">
                    <div class="real-flame"></div>
                    <div class="spark-particle" style="--sx: -1.4; --sy: -2.5;"></div>
                    <div class="spark-particle" style="--sx: 1.7; --sy: -2.8;"></div>
                </div>
            </div>

            <div class="cake-tier tier-1"><div class="frosting-top"></div></div>
            <div class="cake-tier tier-2"><div class="frosting-top"></div></div>
            <div class="cake-tier tier-3"><div class="frosting-top"></div></div>
        </div>

        <!-- Texto romántico formal y claro -->
        <div class="love-text-hd">TE AMO MAS DE LO Q PUEDAS LLEGAR A IMAGINAR Y SENTIR</div>

        <a href="index.html" class="btn-stellar">⬅ Volver al multiverso</a>
    </div>

    <script>
        // Generador continuo de fuegos artificiales de fondo
        const skyCanvas = document.getElementById('skyCanvas');
        setInterval(() => {
            const firework = document.createElement('div');
            firework.classList.add('firework-fx');
            firework.style.left = (Math.random() * 88 + 6) + 'vw';
            firework.style.top = (Math.random() * 75 + 10) + 'vh';
            skyCanvas.appendChild(firework);
            setTimeout(() => firework.remove(), 1200);
        }, 500);

        // Generador de globos 3D realistas subiendo y cayendo
        const balloonsLayer = document.getElementById('balloonsLayer');
        const balloonColors = ['#ff4081', '#ffeb3b', '#00e676', '#00b0ff', '#e040fb', '#ff5722', '#ff9800'];
        
        for (let i = 0; i < 20; i++) {
            const b = document.createElement('div');
            const isAscending = i % 2 === 0;
            b.classList.add(isAscending ? 'real-balloon-up' : 'real-balloon-down');
            
            b.style.left = (Math.random() * 92) + 'vw';
            b.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
            b.style.animationDuration = (4 + Math.random() * 3) + 's';
            b.style.animationDelay = (Math.random() * 5) + 's';
            balloonsLayer.appendChild(b);
        }
    </script>
</body>
</html>
