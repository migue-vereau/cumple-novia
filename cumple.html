<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¡Feliz Cumpleaños, Mi Amor! 🌻✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CONFIGURACIÓN GLOBAL Y OPTIMIZACIÓN DE RENDIMIENTO (SIN LAG)
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transform: translateZ(0); /* Forzar aceleración por hardware */
        }

        body, html {
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #fff176 0%, #ffb300 35%, #e65100 75%, #4e1400 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* ==========================================================================
           2. GUIRNALDAS DE BANDERINES
           ========================================================================== */
        .garland-container, .garland-container-2 {
            position: absolute;
            left: 0;
            width: 100%;
            height: 110px;
            pointer-events: none;
            z-index: 3;
            display: flex;
            justify-content: space-around;
        }
        .garland-container { top: 0; }
        .garland-container-2 { top: 35px; opacity: 0.85; }

        .pennant {
            width: 0;
            height: 0;
            border-left: 24px solid transparent;
            border-right: 24px solid transparent;
            border-top: 40px solid;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            animation: pennantSwing 2.5s ease-in-out infinite alternate;
            transform-origin: top center;
            will-change: transform;
        }

        .p-green { border-top-color: #00e676; }
        .p-sky { border-top-color: #00b0ff; }
        .p-yellow { border-top-color: #ffea00; }
        .p-red { border-top-color: #ff1744; }
        .p-orange { border-top-color: #ff9100; }
        .p-blue { border-top-color: #7c4dff; }
        .p-pink { border-top-color: #ff4081; }
        .p-cyan { border-top-color: #00e5ff; }

        @keyframes pennantSwing {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        /* ==========================================================================
           3. FUEGOS ARTIFICIALES MÁS NOTORIOS Y FLUIDOS
           ========================================================================== */
        .sky-storm {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .firework-particle {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            animation: explodeFluid 1.2s infinite cubic-bezier(0.1, 0.9, 0.2, 1);
            will-change: transform, opacity;
        }

        @keyframes explodeFluid {
            0% {
                transform: translate(0, 0) scale(2.2);
                opacity: 1;
                box-shadow: 0 0 30px #fff, 0 0 60px #ffea00, 0 0 90px #00e5ff, 0 0 130px #ff1744;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.2);
                opacity: 0;
            }
        }

        /* ==========================================================================
           4. LLUVIA DE CONFETI OPTIMIZADA
           ========================================================================== */
        .confetti-rain {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 4;
        }

        .confetti-piece {
            position: absolute;
            width: 14px;
            height: 20px;
            opacity: 0.9;
            animation: fallOptimized 4s infinite linear;
            will-change: transform;
        }

        @keyframes fallOptimized {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
        }

        /* ==========================================================================
           5. GLOBOS FLUIDOS
           ========================================================================== */
        .balloons-storm {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 2;
        }

        .b-item {
            position: absolute;
            width: 80px;
            height: 105px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: balloonFloatSmooth 5s infinite linear;
            box-shadow: inset -12px -18px 30px rgba(0,0,0,0.4), 0 0 25px rgba(255,255,255,0.8);
            will-change: transform;
        }

        .b-item::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 38px;
            width: 2px;
            height: 35px;
            background: rgba(255,255,255,0.9);
        }

        @keyframes balloonFloatSmooth {
            0% { transform: translateY(115vh) translateX(0); }
            50% { transform: translateY(50vh) translateX(25px); }
            100% { transform: translateY(-20vh) translateX(-25px); }
        }

        /* ==========================================================================
           6. ESCENARIO PRINCIPAL
           ========================================================================== */
        .colossal-stage {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 100vh;
            padding-bottom: 12px;
            text-align: center;
            pointer-events: none;
        }

        /* ==========================================================================
           7. TÍTULO PRINCIPAL (INTACTO)
           ========================================================================== */
        h1 {
            position: relative;
            z-index: 100;
            font-size: 2.3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff 15%, #ffe57f 40%, #ff5252 80%, #ff1744 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 20px rgba(255, 23, 68, 1));
            letter-spacing: 1.5px;
            pointer-events: auto;
        }

        /* ==========================================================================
           8. NUEVO PASTEL DE VAINILLA ELEGANTE Y SOFISTICADO (CERO INFANTIL)
           ========================================================================== */
        .mega-cake {
            position: relative;
            z-index: 10;
            width: 820px;
            height: 440px;
            margin: 0 auto;
            filter: drop-shadow(0 35px 35px rgba(20,5,0,0.8));
            pointer-events: auto;
        }

        .m-tier {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 20px;
        }

        /* Capa Base de Vainilla Elegante */
        .tier-base {
            bottom: 0;
            width: 820px;
            height: 150px;
            background: linear-gradient(90deg, #e4c280, #fff3d1, #e4c280);
            border: 4px solid #b38f45;
            border-bottom: 12px solid #5a3e1b;
            box-shadow: inset 0 20px 30px rgba(255,255,255,0.9), inset 0 -20px 30px rgba(90,62,27,0.5);
        }

        /* Capa Intermedia de Vainilla Elegante */
        .tier-middle {
            bottom: 138px;
            width: 650px;
            height: 140px;
            background: linear-gradient(90deg, #edd297, #fff8e6, #edd297);
            border: 4px solid #c49e52;
            border-bottom: 10px solid #6b4920;
            box-shadow: inset 0 18px 25px rgba(255,255,255,0.9), inset 0 -18px 25px rgba(107,73,32,0.4);
        }

        /* Capa Superior de Vainilla Elegante */
        .tier-top {
            bottom: 268px;
            width: 470px;
            height: 130px;
            background: linear-gradient(90deg, #f6e2b3, #fffbf0, #f6e2b3);
            border: 4px solid #d4af37;
            border-bottom: 9px solid #7d5828;
            box-shadow: inset 0 15px 22px rgba(255,255,255,1), inset 0 -15px 22px rgba(125,88,40,0.4);
        }

        /* Relleno fino de vainilla gourmet / crema tostada */
        .cake-filling-vanilla {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 16px;
            background: linear-gradient(90deg, #8c6239, #c19a6b, #8c6239);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        /* Cobertura superior de crema diplomática elegante con brillo sutil */
        .frosting-vanilla {
            position: absolute;
            top: 0;
            width: 100%;
            height: 32px;
            background: linear-gradient(180deg, #fffdfa 0%, #e6cb94 100%);
            border-radius: 16px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        /* Perlas decorativas doradas elegantes */
        .gold-pearl {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 30% 30%, #fff 20%, #d4af37 80%);
            border-radius: 50%;
            box-shadow: 0 0 6px #d4af37;
            z-index: 5;
        }

        /* ==========================================================================
           9. VELAS FINAS Y LLAMAS BRILLANTES
           ========================================================================== */
        .candles-mega-row {
            position: absolute;
            top: -85px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 80px;
            z-index: 15;
        }

        .candle-stick-mega {
            width: 18px;
            height: 90px;
            background: linear-gradient(90deg, #d4af37, #fff, #d4af37);
            border-radius: 4px;
            position: relative;
            box-shadow: inset -3px 0 6px rgba(0,0,0,0.4), 0 0 20px rgba(212,175,55,0.8);
        }

        .mega-flame {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 50px;
            background: radial-gradient(circle at 50% 25%, #ffffff 15%, #ffea00 45%, #ff3d00 80%, rgba(255,0,0,0) 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 40px #ffea00, 0 0 80px #ff3d00, 0 0 120px #ff1744;
            animation: flameFlickerSmooth 0.2s infinite alternate;
            will-change: transform, filter;
        }

        @keyframes flameFlickerSmooth {
            0% { transform: translateX(-50%) scale(0.95); filter: brightness(1); }
            100% { transform: translateX(-50%) scale(1.15); filter: brightness(1.3); }
        }

        /* ==========================================================================
           10. TEXTO ROMÁNTICO Y BOTÓN ESTELAR
           ========================================================================== */
        .love-text-floating {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fffae6;
            margin: 6px 0 10px 0;
            text-shadow: 0 0 25px rgba(255, 235, 59, 1), 0 0 45px rgba(255, 23, 68, 0.9), 3px 3px 10px rgba(0,0,0,0.9);
            letter-spacing: 1.5px;
            text-align: center;
            pointer-events: auto;
        }

        .btn-colossal {
            background: linear-gradient(135deg, #00e676, #00b0ff, #ffea00, #ff1744);
            color: #ffffff;
            padding: 14px 42px;
            border-radius: 35px;
            font-weight: 900;
            text-decoration: none;
            font-size: 1.1rem;
            box-shadow: 0 0 35px rgba(0, 230, 118, 0.8);
            transition: transform 0.2s ease;
            display: inline-block;
            margin-bottom: 10px;
            pointer-events: auto;
        }

        .btn-colossal:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Guirnaldas -->
    <div class="garland-container">
        <div class="pennant p-green"></div><div class="pennant p-sky"></div><div class="pennant p-yellow"></div><div class="pennant p-red"></div><div class="pennant p-orange"></div><div class="pennant p-blue"></div><div class="pennant p-pink"></div><div class="pennant p-cyan"></div>
    </div>
    <div class="garland-container-2">
        <div class="pennant p-pink"></div><div class="pennant p-cyan"></div><div class="pennant p-green"></div><div class="pennant p-sky"></div><div class="pennant p-yellow"></div><div class="pennant p-red"></div><div class="pennant p-orange"></div><div class="pennant p-blue"></div>
    </div>

    <!-- Fuegos artificiales -->
    <div class="sky-storm" id="skyStorm"></div>

    <!-- Confeti -->
    <div class="confetti-rain" id="confettiRain"></div>

    <!-- Globos -->
    <div class="balloons-storm" id="balloonsStorm"></div>

    <!-- Escenario principal -->
    <div class="colossal-stage">
        
        <h1>¡FELIZ CUMPLEAÑOS A LA NIÑA MÁS HERMOSA DEL MUNDOOOOOO!</h1>

        <!-- Pastel Elegante de Vainilla -->
        <div class="mega-cake">
            <div class="candles-mega-row">
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
                <div class="candle-stick-mega"><div class="mega-flame"></div></div>
            </div>

            <!-- Capa Superior Vainilla -->
            <div class="m-tier tier-top">
                <div class="cake-filling-vanilla"></div>
                <div class="frosting-vanilla"></div>
                <div class="gold-pearl" style="top: 10px; left: 70px;"></div>
                <div class="gold-pearl" style="top: 12px; left: 200px;"></div>
                <div class="gold-pearl" style="top: 10px; left: 330px;"></div>
                <div class="gold-pearl" style="top: 12px; left: 410px;"></div>
            </div>

            <!-- Capa Intermedia Vainilla -->
            <div class="m-tier tier-middle">
                <div class="cake-filling-vanilla"></div>
                <div class="frosting-vanilla"></div>
                <div class="gold-pearl" style="top: 10px; left: 90px;"></div>
                <div class="gold-pearl" style="top: 12px; left: 250px;"></div>
                <div class="gold-pearl" style="top: 10px; left: 450px;"></div>
                <div class="gold-pearl" style="top: 12px; left: 570px;"></div>
            </div>

            <!-- Capa Base Vainilla -->
            <div class="m-tier tier-base">
                <div class="cake-filling-vanilla"></div>
                <div class="frosting-vanilla"></div>
                <div class="gold-pearl" style="top: 10px; left: 120px;"></div>
                <div class="gold-pearl" style="top: 12px; left: 320px;"></div>
                <div class="gold-pearl" style="top: 10px; left: 520px;"></div>
                <div class="gold-pearl" style="top: 12px; left: 720px;"></div>
            </div>
        </div>

        <!-- Mensaje -->
        <div class="love-text-floating">TE AMO MAS DE LO Q PUEDAS LLEGAR A IMAGINAR Y SENTIR</div>

        <!-- Botón -->
        <a href="index.html" class="btn-colossal">⬅ Volver al multiverso</a>
    </div>

    <!-- Script optimizado para fluidez total sin lag -->
    <script>
        const skyStorm = document.getElementById('skyStorm');
        const fireworkColors = ['#00e676', '#00b0ff', '#ffea00', '#ff1744', '#ff9100', '#7c4dff', '#ff4081', '#00e5ff', '#ffffff', '#d4af37'];

        function lanzarFuegoFluido() {
            const centerX = Math.random() * 85 + 7;
            const centerY = Math.random() * 55 + 15;
            for (let i = 0; i < 36; i++) {
                const p = document.createElement('div');
                p.classList.add('firework-particle');
                const angle = (Math.PI * 2 / 36) * i;
                const distance = 90 + Math.random() * 110;
                p.style.left = centerX + 'vw';
                p.style.top = centerY + 'vh';
                p.style.backgroundColor = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
                p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                skyStorm.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }
        setInterval(lanzarFuegoFluido, 450);

        // Confeti optimizado en cantidad prudente para cero lag
        const confettiRain = document.getElementById('confettiRain');
        for (let i = 0; i < 50; i++) {
            const c = document.createElement('div');
            c.classList.add('confetti-piece');
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
            c.style.animationDuration = (3.0 + Math.random() * 2) + 's';
            c.style.animationDelay = (Math.random() * 3) + 's';
            if(Math.random() > 0.4) c.style.borderRadius = '50%';
            confettiRain.appendChild(c);
        }

        // Globos optimizados
        const balloonsStorm = document.getElementById('balloonsStorm');
        const vibrantBalloonColors = ['#00e676', '#00b0ff', '#ffea00', '#ff1744', '#ff9100', '#7c4dff', '#ff4081', '#00e5ff'];

        for (let i = 0; i < 45; i++) {
            const b = document.createElement('div');
            b.classList.add('b-item');
            b.style.left = (Math.random() * 95) + 'vw';
            b.style.backgroundColor = vibrantBalloonColors[Math.floor(Math.random() * vibrantBalloonColors.length)];
            b.style.animationDuration = (3.5 + Math.random() * 2.5) + 's';
            b.style.animationDelay = (Math.random() * 4) + 's';
            balloonsStorm.appendChild(b);
        }
    </script>
</body>
</html>
