<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños, Mi Vida! 🌸</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b002b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff99cc;
            text-shadow: 0 0 15px rgba(255, 153, 204, 0.8);
            z-index: 10;
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            padding: 0 20px;
            color: #ffcce6;
            line-height: 1.5;
            z-index: 10;
        }

        .flowers {
            display: flex;
            gap: 20px;
            font-size: 3rem;
            margin-bottom: 20px;
            animation: bloom 3s ease-in-out infinite alternate;
        }

        @keyframes bloom {
            from { transform: scale(0.8); opacity: 0.7; }
            to { transform: scale(1.2); opacity: 1; }
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #ff99cc;
        }
    </style>
</head>
<body>

    <div class="flowers">
        <span>🌷</span>
        <span>🌻</span>
        <span>🌹</span>
    </div>

    <h1>¡Feliz Cumpleaños, Mi Vida! 🌸</h1>
    <p>He preparado este pequeño detalle digital especialmente para ti, porque te mereces el universo entero. Que cada día esté lleno de flores y de tanta felicidad como la que tú me das. ¡Te amo muchísimo!</p>
    
    <div class="footer">Hecho con todo el amor del mundo para ti 💖</div>

</body>
</html>
