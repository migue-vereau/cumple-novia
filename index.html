<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños, Mi Amor!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a001a, #4d0039);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff99bb;
            text-shadow: 0 0 15px rgba(255, 153, 187, 0.6);
            animation: fadeIn 2s ease-in-out;
        }
        p {
            font-size: 1.2rem;
            max-width: 600px;
            padding: 0 20px;
            color: #ffccdd;
            margin-bottom: 30px;
            animation: fadeIn 3s ease-in-out;
        }
        .flower-container {
            font-size: 5rem;
            animation: bounce 2s infinite alternate;
            cursor: pointer;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #cca6ff;
        }
    </style>
</head>
<body>

    <h1>¡Feliz Cumpleaños, Mi Vida! 🌸</h1>
    <p>Hice este pequeño detalle digital especialmente para ti, porque te mereces el universo entero. Que cada día esté lleno de flores y de tanta felicidad como la que tú me das. ¡Te amo muchísimo!</p>
    
    <div class="flower-container">
        🌷🌻🌹
    </div>

    <div class="footer">Hecho con todo el amor del mundo para ti 💖</div>

</body>
</html>
